config:
  target: 'http://localhost:3000'
  phases:
    # Warm-up phase
    - duration: 60
      arrivalRate: 10
      name: "Warm-up"
    # Ramp-up phase to 1000 users
    - duration: 300
      arrivalRate: 50
      rampTo: 200
      name: "Ramp-up to 1000 users"
    # Peak load phase - 1000 concurrent users
    - duration: 600
      arrivalRate: 200
      name: "Peak load - 1000 concurrent users"
    # Stress test beyond 1000 users
    - duration: 180
      arrivalRate: 250
      name: "Stress test - 1250 users"
    # Cool-down phase
    - duration: 120
      arrivalRate: 250
      rampTo: 10
      name: "Cool-down"
  variables:
    pageSize: [10, 20, 50]
    category: ["house", "apartment", "land", "commercial"]
    propertyType: ["rent", "sale"]
    location: ["Lilongwe", "Blantyre", "Mzuzu", "Zomba"]
  defaults:
    headers:
      'Content-Type': 'application/json'
      'Accept': 'application/json'

scenarios:
  - name: "Heavy Load Test - 1000 Users"
    weight: 100
    flow:
      # Test properties listing endpoint with caching
      - get:
          url: "/api/properties"
          qs:
            page: "{{ Math.floor(Math.random() * 5) + 1 }}"
            pageSize: "{{ pageSize }}"
            category: "{{ category }}"
            propertyType: "{{ propertyType }}"
            location: "{{ location }}"
          capture:
            - json: "$.properties[0].id"
              as: "randomPropertyId"
          expect:
            - statusCode: 200
          tags:
            - properties-heavy-load
            - cache-test

      # Test promoted properties (should be cached)
      - get:
          url: "/api/properties/promoted"
          expect:
            - statusCode: 200
          tags:
            - promoted-properties-cached

      # Test individual property detail if available
      - get:
          url: "/api/properties/{{ randomPropertyId }}"
          ifTrue: "randomPropertyId"
          expect:
            - statusCode: [200, 404]
          tags:
            - property-detail-load

      # Test static data caching
      - get:
          url: "/api/subscriptions/plans"
          expect:
            - statusCode: 200
          tags:
            - static-data-cached

      # Test health endpoint
      - get:
          url: "/api/monitoring/health"
          expect:
            - statusCode: 200
          tags:
            - health-check

      # Simulate user behavior with think time
      - think: "{{ Math.random() * 2 + 0.5 }}"

      # Test search with filters (cache miss scenarios)
      - get:
          url: "/api/properties"
          qs:
            page: 1
            pageSize: 20
            minPrice: "{{ Math.floor(Math.random() * 500000) + 100000 }}"
            maxPrice: "{{ Math.floor(Math.random() * 2000000) + 1000000 }}"
            bedrooms: "{{ Math.floor(Math.random() * 5) + 1 }}"
            bathrooms: "{{ Math.floor(Math.random() * 4) + 1 }}"
          expect:
            - statusCode: 200
          tags:
            - filtered-search-load

      # Test pagination under load
      - loop:
          - get:
              url: "/api/properties"
              qs:
                page: "{{ $loopCount + 1 }}"
                pageSize: 10
                category: "house"
              expect:
                - statusCode: 200
              tags:
                - pagination-stress-test
          count: 2