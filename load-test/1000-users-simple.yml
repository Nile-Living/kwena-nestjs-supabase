config:
  target: 'http://localhost:3000'
  phases:
    # Warm-up phase
    - duration: 60
      arrivalRate: 10
      name: "Warm-up"
    # Ramp-up phase to 1000 users
    - duration: 300
      arrivalRate: 50
      rampTo: 200
      name: "Ramp-up to 1000 users"
    # Peak load phase - 1000 concurrent users
    - duration: 600
      arrivalRate: 200
      name: "Peak load - 1000 concurrent users"
    # Cool-down phase
    - duration: 120
      arrivalRate: 200
      rampTo: 10
      name: "Cool-down"
  variables:
    pageSize: [10, 20, 50]
    category: ["house", "apartment", "land", "commercial"]
    propertyType: ["rent", "sale"]
    location: ["Lilongwe", "Blantyre", "Mzuzu", "Zomba"]
  defaults:
    headers:
      'Content-Type': 'application/json'
      'Accept': 'application/json'

scenarios:
  - name: "1000 User Load Test"
    weight: 100
    flow:
      # Test properties listing endpoint with caching
      - get:
          url: "/api/properties"
          qs:
            page: "{{ Math.floor(Math.random() * 5) + 1 }}"
            pageSize: "{{ pageSize }}"
            category: "{{ category }}"
            propertyType: "{{ propertyType }}"
            location: "{{ location }}"
          expect:
            - statusCode: 200
          tags:
            - properties-load

      # Test promoted properties (cached)
      - get:
          url: "/api/properties/promoted"
          expect:
            - statusCode: 200
          tags:
            - promoted-cached

      # Test static data caching
      - get:
          url: "/api/subscriptions/plans"
          expect:
            - statusCode: 200
          tags:
            - static-cached

      # Test health endpoint
      - get:
          url: "/api/monitoring/health"
          expect:
            - statusCode: 200
          tags:
            - health

      # Think time
      - think: 1

      # Test filtered search
      - get:
          url: "/api/properties"
          qs:
            page: 1
            pageSize: 20
            minPrice: "{{ Math.floor(Math.random() * 500000) + 100000 }}"
            maxPrice: "{{ Math.floor(Math.random() * 2000000) + 1000000 }}"
          expect:
            - statusCode: 200
          tags:
            - filtered-search